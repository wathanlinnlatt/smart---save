<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Savings</title>
  <!-- stlite runs the Streamlit app (app.py) inside the browser, so it works on GitHub Pages -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.css">
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js";

    // Read the packages from requirements.txt (stlite already includes streamlit)
    const text = await fetch("requirements.txt").then((r) => r.text());
    const requirements = text.split("\n").map((line) => line.trim())
      .filter((line) => line && !line.startsWith("#") && !line.startsWith("streamlit"));

    // Copy the website and model files from this repository into the browser
    const files = {};
    for (const name of ["app.py", "savings_model.joblib", "saver_model.joblib", "customers_with_groups.csv"]) {
      files[name] = { url: new URL(name, location.href).href };
    }

    mount({ requirements, entrypoint: "app.py", files }, document.getElementById("root"));
  </script>
</body>
</html>
